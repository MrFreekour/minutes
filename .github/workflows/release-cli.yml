name: Release CLI Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release_readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify committed release invariants
        run: node scripts/check_version_sync.mjs --release

  build:
    name: Build (${{ matrix.target }})
    needs: release_readiness
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: minutes
            asset: minutes-macos-arm64
            # engine-sherpa is macOS-only here: sherpa-onnx links statically on
            # darwin (self-contained binary, #369) but dynamically on Linux and
            # Windows, where shipping it would need the dylibs bundled alongside.
            features: parakeet,metal,engine-sherpa
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: minutes.exe
            asset: minutes-windows-x64.exe
            features: parakeet
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: minutes
            asset: minutes-linux-x64
            features: parakeet

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Set CXXFLAGS for whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-I$(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"

      - name: Resolve runner image for cache scope
        id: runner-image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Scope by runner image so a runner-image rotation does not restore a stale
          # target/ cache with toolchain paths the new image no longer ships
          # (e.g. macOS 15 -> macOS 26 Xcode change). See ci.yml.
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Clean stale Windows native build cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf \
            target/debug/build/whisper-rs-sys-* \
            target/release/build/whisper-rs-sys-* \
            target/debug/build/knf-rs-sys-* \
            target/release/build/knf-rs-sys-*

      - name: Build release binary
        run: cargo build --release -p minutes-cli --features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}

      # Additive second artifact for Linux only: the same CLI plus the sherpa
      # engine and its shared libraries, as a tarball. The bare binary above is
      # unchanged, so existing installs and the Homebrew formula are unaffected.
      #
      # sherpa-onnx links dynamically on Linux, so the binary needs
      # libsherpa-onnx-c-api.so and libonnxruntime.so beside it. `$ORIGIN`
      # runpath makes the loader look next to the executable rather than in the
      # build tree. Static linkage is deliberately not used here: sherpa-rs-sys
      # demands a global `-C relocation-model=dynamic-no-pic`, which produces a
      # non-PIE binary and loses ASLR for every Linux user (#645).
      - name: Build sherpa-enabled Linux archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"
        run: |
          set -euo pipefail
          cargo build --release -p minutes-cli \
            --features ${{ matrix.features }},engine-sherpa \
            --target ${{ matrix.target }}
          out="minutes-linux-x64-sherpa"
          rm -rf "$out" && mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$out/minutes"
          # sherpa-rs-sys drops its shared libraries into the target profile dir.
          find "target/${{ matrix.target }}/release" -maxdepth 1 -name '*.so' -exec cp {} "$out/" \;
          test -f "$out/libsherpa-onnx-c-api.so" \
            || { echo "sherpa shared library missing from the archive"; exit 1; }
          # Prove it loads outside the build tree, which a build-only check
          # cannot catch: the failure mode is loader search paths.
          ( cd /tmp && env -u LD_LIBRARY_PATH "$GITHUB_WORKSPACE/$out/minutes" --version )
          tar czf "$out.tar.gz" "$out"

      - name: Upload sherpa archive artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: minutes-linux-x64-sherpa.tar.gz
          path: minutes-linux-x64-sherpa.tar.gz

      - name: Upload sherpa archive release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          files: minutes-linux-x64-sherpa.tar.gz

  checksums:
    name: Publish CLI checksums
    needs: [release_readiness, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f | sort | while IFS= read -r file; do
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksum release asset
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS.txt
